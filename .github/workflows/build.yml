name: Compilar tudo

on:
  push:
  workflow_dispatch:

jobs:
  app-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Chave de assinatura (se existir nos Secrets)
        env: { KS: "${{ secrets.KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/detetor.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/detetor.jks" >> "$GITHUB_ENV"
            echo "A usar a chave fixa"
          else
            echo "Sem chave fixa: assinatura de debug aleatória"
          fi
      - name: Compilar APK
        env: { KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}" }
        run: gradle -p app-android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-detetor-drones
          path: app-android/app/build/outputs/apk/debug/*.apk

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { env: [s3] }   # c5 fora da compra atual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install platformio
      - name: Compilar firmware ${{ matrix.env }}
        run: pio run -d firmware -e ${{ matrix.env }}
      - name: Juntar num só ficheiro (gravar no endereço 0x0)
        run: |
          pip install esptool
          B=firmware/.pio/build/${{ matrix.env }}
          CHIP=$([ "${{ matrix.env }}" = s3 ] && echo esp32s3 || echo esp32c5)
          BOOTAPP=$(find ~/.platformio -name boot_app0.bin | head -1)
          python -m esptool --chip $CHIP merge_bin -o $B/detetor-${{ matrix.env }}-completo.bin \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 $BOOTAPP 0x10000 $B/firmware.bin
          ls -la $B/*.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: firmware/.pio/build/${{ matrix.env }}/detetor-*-completo.bin

  firmware-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar o parser de Remote ID no PC
        run: |
          git clone -q https://github.com/opendroneid/opendroneid-core-c.git /tmp/odid
          cd /tmp/odid && git checkout -q 849c03adbe0cdd68997a462fafab397edcfe53f3 && cd -
          O=/tmp/odid/libopendroneid
          gcc -c -I$O $O/opendroneid.c -o /tmp/odid.o
          gcc -c -I$O $O/wifi.c -o /tmp/wifi.o
          g++ -Ifirmware/src -I$O firmware/test/test_parser.cpp firmware/src/rid_parser.cpp \
              /tmp/odid.o /tmp/wifi.o -o /tmp/t && /tmp/t

  pi-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pytest pyserial
      - run: cd pi && python -m pytest -q tests

  publicar:
    # Põe o APK e o firmware como ficheiros diretos em Releases → "ultima"
    needs: [app-android, firmware]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publicar a última versão
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ls -la dist
          cp dist/*.apk DetetorDrones.apk
          cp dist/detetor-s3-completo.bin detetor-s3-completo.bin
          gh release delete ultima -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create ultima -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Última versão" \
            --notes "Compilada automaticamente (commit ${GITHUB_SHA::7}). APK para o telemóvel e firmware para o ESP32-S3 (gravar no endereço 0x0)." \
            DetetorDrones.apk detetor-s3-completo.bin
