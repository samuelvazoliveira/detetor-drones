; Detetor de Drones — recetores passivos de Remote ID (firmware v2: sem Wi-Fi de casa)
; Saída: JSON por USB para o Raspberry Pi. Não transmitem nada para os drones.
;
;   pio run -e s3 -t upload     → ESP32-S3 (2,4 GHz + Bluetooth)
;   pio run -e c5 -t upload     → ESP32-C5 (5 GHz)
;
; O C5 precisa do core Arduino 3.3+ (IDF 5.5), que vem da plataforma pioarduino.

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
extra_scripts = pre:get_odid.py
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:s3]
board = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    ${env.build_flags}
    -DCONFIG_BT_NIMBLE_EXT_ADV=1

[env:c5]
board = esp32-c5-devkitc-1
