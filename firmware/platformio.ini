; Detetor de Drones — recetor passivo de Remote ID (sem Wi-Fi de casa)
; Não transmite nada para os drones.
;
;   pio run -e s3 -t upload     → ESP32-S3 (2,4 GHz Wi-Fi + Bluetooth 4/5 Long Range)
;   pio run -e c5 -t upload     → ESP32-C5 (5 GHz) — opcional, fora da compra atual

[env]
framework = arduino
monitor_speed = 115200
extra_scripts = pre:get_odid.py
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

[env:s3]
; core Arduino 2.0.x estável (a NimBLE-Arduino choca com o NimBLE embutido no core 3.3)
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DMYNEWT_VAL_BLE_EXT_ADV=1

[env:c5]
; o C5 precisa do core 3.3+ (IDF 5.5), que vem da plataforma pioarduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c5-devkitc-1
